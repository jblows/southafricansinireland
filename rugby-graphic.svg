<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <!-- SA flag gradient -->
    <linearGradient id="sa-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DE3831"/>
      <stop offset="33%" stop-color="#DE3831"/>
      <stop offset="33%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#007749"/>
      <stop offset="60%" stop-color="#007749"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="67%" stop-color="#FFFFFF"/>
      <stop offset="67%" stop-color="#002395"/>
      <stop offset="100%" stop-color="#002395"/>
    </linearGradient>
    <!-- Irish flag gradient -->
    <linearGradient id="ie-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#169B62"/>
      <stop offset="33%" stop-color="#169B62"/>
      <stop offset="33%" stop-color="#FFFFFF"/>
      <stop offset="66%" stop-color="#FFFFFF"/>
      <stop offset="66%" stop-color="#FF883E"/>
      <stop offset="100%" stop-color="#FF883E"/>
    </linearGradient>
    <!-- Grass gradient -->
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d8a4e"/>
      <stop offset="100%" stop-color="#1a5c32"/>
    </linearGradient>
    <!-- Stadium light glow -->
    <radialGradient id="glow-left" cx="25%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(255,184,28,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="75%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(22,155,98,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <filter id="shadow-sm">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <filter id="text-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFB81C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background - dark pitch -->
  <rect width="1200" height="500" fill="#0a1f12"/>

  <!-- Stadium glow effects -->
  <rect width="1200" height="500" fill="url(#glow-left)"/>
  <rect width="1200" height="500" fill="url(#glow-right)"/>

  <!-- Pitch lines -->
  <rect x="0" y="380" width="1200" height="120" fill="url(#grass)" opacity="0.6"/>
  <line x1="600" y1="380" x2="600" y2="500" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="0" y1="380" x2="1200" y2="380" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Centre circle -->
  <circle cx="600" cy="440" rx="60" ry="30" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- SA Side (Left) -->
  <!-- SA Shield/Crest shape -->
  <g filter="url(#shadow-sm)">
    <path d="M180,100 L280,100 Q300,100 300,120 L300,280 Q300,320 240,350 L230,355 L220,350 Q160,320 160,280 L160,120 Q160,100 180,100 Z" fill="url(#sa-grad)" stroke="#FFB81C" stroke-width="3"/>
    <!-- Springbok silhouette on shield -->
    <g transform="translate(175, 150) scale(0.55)">
      <!-- Body -->
      <ellipse cx="100" cy="100" rx="55" ry="32" fill="#FFB81C"/>
      <!-- Neck -->
      <path d="M140,85 Q165,55 155,35" stroke="#FFB81C" stroke-width="18" fill="none" stroke-linecap="round"/>
      <!-- Head -->
      <ellipse cx="158" cy="30" rx="20" ry="14" fill="#FFB81C"/>
      <!-- Horns -->
      <path d="M150,18 Q142,-5 155,-15" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M165,18 Q172,-5 162,-15" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Legs (running pose) -->
      <path d="M65,125 L50,175" stroke="#FFB81C" stroke-width="10" stroke-linecap="round"/>
      <path d="M85,128 L75,170" stroke="#FFB81C" stroke-width="10" stroke-linecap="round"/>
      <path d="M120,128 L140,170" stroke="#FFB81C" stroke-width="10" stroke-linecap="round"/>
      <path d="M135,125 L160,165" stroke="#FFB81C" stroke-width="10" stroke-linecap="round"/>
      <!-- White belly stripe -->
      <path d="M50,100 Q100,115 150,95" stroke="white" stroke-width="4" fill="none" opacity="0.7"/>
      <!-- Tail -->
      <path d="M45,90 Q25,75 30,65" stroke="#FFB81C" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Irish Side (Right) -->
  <!-- Irish Shield/Crest shape -->
  <g filter="url(#shadow-sm)">
    <path d="M900,100 L1000,100 Q1020,100 1020,120 L1020,280 Q1020,320 960,350 L950,355 L940,350 Q880,320 880,280 L880,120 Q880,100 900,100 Z" fill="url(#ie-grad)" stroke="#169B62" stroke-width="3"/>
    <!-- Shamrock on shield -->
    <g transform="translate(910, 145) scale(1.3)">
      <!-- Shamrock leaves -->
      <ellipse cx="50" cy="65" rx="18" ry="22" fill="#007749" transform="rotate(-30, 50, 65)"/>
      <ellipse cx="75" cy="65" rx="18" ry="22" fill="#007749" transform="rotate(30, 75, 65)"/>
      <ellipse cx="62" cy="45" rx="18" ry="22" fill="#007749"/>
      <!-- Stem -->
      <path d="M62,80 Q65,105 60,120" stroke="#007749" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- Leaf veins -->
      <line x1="50" y1="50" x2="50" y2="75" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <line x1="75" y1="50" x2="75" y2="75" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <line x1="62" y1="30" x2="62" y2="58" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Centre Rugby Ball -->
  <g filter="url(#shadow-sm)" transform="translate(540, 160)">
    <!-- Ball shape -->
    <ellipse cx="60" cy="70" rx="50" ry="70" fill="#8B4513" transform="rotate(-20, 60, 70)"/>
    <!-- Ball highlight -->
    <ellipse cx="50" cy="55" rx="25" ry="40" fill="#A0522D" opacity="0.6" transform="rotate(-20, 50, 55)"/>
    <!-- Seam line -->
    <path d="M60,5 Q55,70 60,135" stroke="white" stroke-width="2.5" fill="none"/>
    <!-- Cross stitches -->
    <line x1="50" y1="35" x2="70" y2="30" stroke="white" stroke-width="1.5"/>
    <line x1="48" y1="50" x2="68" y2="45" stroke="white" stroke-width="1.5"/>
    <line x1="47" y1="65" x2="67" y2="60" stroke="white" stroke-width="1.5"/>
    <line x1="48" y1="80" x2="68" y2="75" stroke="white" stroke-width="1.5"/>
    <line x1="50" y1="95" x2="70" y2="90" stroke="white" stroke-width="1.5"/>
    <line x1="52" y1="110" x2="72" y2="105" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- VS Text -->
  <text x="600" y="420" font-family="Poppins, sans-serif" font-size="42" font-weight="700" fill="white" text-anchor="middle" filter="url(#text-glow)">VS</text>

  <!-- Team Names -->
  <text x="230" y="420" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#FFB81C" text-anchor="middle">SPRINGBOKS</text>
  <text x="230" y="455" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.7)" text-anchor="middle">SOUTH AFRICA</text>

  <text x="950" y="420" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#169B62" text-anchor="middle">IRELAND</text>
  <text x="950" y="455" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.7)" text-anchor="middle">RUGBY</text>

  <!-- Title at top -->
  <text x="600" y="55" font-family="Poppins, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="4">RUGBY CHAMPIONSHIP 2026</text>

  <!-- Decorative stars -->
  <text x="460" y="58" font-size="14" fill="#FFB81C">&#9733;</text>
  <text x="480" y="58" font-size="14" fill="#FFB81C">&#9733;</text>
  <text x="500" y="58" font-size="14" fill="#FFB81C">&#9733;</text>
  <text x="700" y="58" font-size="14" fill="#FFB81C">&#9733;</text>
  <text x="720" y="58" font-size="14" fill="#FFB81C">&#9733;</text>
  <text x="740" y="58" font-size="14" fill="#FFB81C">&#9733;</text>

  <!-- Light rays from center -->
  <line x1="600" y1="100" x2="400" y2="0" stroke="rgba(255,184,28,0.05)" stroke-width="40"/>
  <line x1="600" y1="100" x2="800" y2="0" stroke="rgba(22,155,98,0.05)" stroke-width="40"/>
  <line x1="600" y1="100" x2="300" y2="0" stroke="rgba(255,184,28,0.03)" stroke-width="30"/>
  <line x1="600" y1="100" x2="900" y2="0" stroke="rgba(22,155,98,0.03)" stroke-width="30"/>
</svg>
